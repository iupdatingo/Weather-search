<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #4facfe;
        }

        input[type="text"] {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            background: #4facfe;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #00aaff;
        }

        .result {
            margin-top: 20px;
            font-size: 16px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Search</h1>
        <form id="searchForm">
            <input type="text" id="cityInput" placeholder="Enter city name" required>
            <button type="submit">Search</button>
        </form>
        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent form submission from refreshing the page

            const city = document.getElementById('cityInput').value; // Get the city name
            const resultDiv = document.getElementById('result');

            // Reset previous result
            resultDiv.innerHTML = '';

            try {
                // Call the Flask backend
                const response = await fetch(`/weather?city=${encodeURIComponent(city)}`);
                const data = await response.json();

                if (response.status !== 200) {
                    // Handle error response
                    resultDiv.innerHTML = `<p class="error">${data.error}</p>`;
                } else {
                    // Display weather data on the page
                    resultDiv.innerHTML = `
                        <h2>Weather in ${city}</h2>
                        <p><strong>Temperature:</strong> ${data.temperature_celsius.toFixed(1)}°C / ${data.temperature_fahrenheit.toFixed(1)}°F</p>
                        <p><strong>Feels Like:</strong> ${data.feels_like_celsius.toFixed(1)}°C / ${data.feels_like_fahrenheit.toFixed(1)}°F</p>
                        <p><strong>Humidity:</strong> ${data.humidity}%</p>
                        <p><strong>Condition:</strong> ${data.description}</p>
                        <p><strong>Wind Speed:</strong> ${data.wind_speed} m/s</p>
                        <p><strong>Sunrise:</strong> ${new Date(data.sunrise).toLocaleTimeString()}</p>
                        <p><strong>Sunset:</strong> ${new Date(data.sunset).toLocaleTimeString()}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">An error occurred. Please try again later.</p>`;
            }
        });
    </script>
</body>
</html>
